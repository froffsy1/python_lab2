
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
</head>
<body>
    <h1>Панель администратора</h1>
    <p>Управление товарами магазина</p>
    <p>{{ message }}</p>
    <h2>Текущие товары</h2>

    {% for product in products %}
        <div>
            <strong>{{ product.name }}</strong>
            — {{ product.price }} ₽
            (ID: {{ product.id }})
        </div>
    {% endfor %}

    <hr>

    <h2>Изменить цену товара</h2>

    <form method="POST">
        <label for="product_id">ID товара:</label>
        <input
            type="number"
            id="product_id"
            name="product_id"
            min="1"
            required
        >

        <br><br>

        <label for="new_price">Новая цена:</label>
        <input
            type="number"
            id="new_price"
            name="new_price"
            min="0"
            step="0.01"
            required
        >

        <br><br>

        <button type="submit">Изменить цену</button>
    </form>

    <p><a href="/">Вернуться в каталог</a></p>
    <p><a href="/logout">Выйти из панели</a></p>
</body>
</html>
